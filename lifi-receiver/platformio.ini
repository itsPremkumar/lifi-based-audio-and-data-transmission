; PlatformIO Project Configuration File
; LiFi Receiver - Arduino Uno
; Upload to the RECEIVER Arduino only
;
; No external libraries are needed any more: the 16x2 I2C LCD driver is
; implemented directly in src/main.cpp (HD44780 over a PCF8574 backpack), which
; also lets the expander pin mapping be switched at runtime with the 'N' command.
; Wire (I2C master) ships with the Arduino AVR core.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
upload_speed = 115200