; SIMPLE WIRED KEYPAD RECEIVER - Arduino Uno
; Upload to the board that has the 16x2 I2C LCD attached.
;
; No external libraries: the I2C LCD driver is inside src/main.cpp.
; Wire (bundled with the Arduino AVR core) provides I2C.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
upload_speed = 115200